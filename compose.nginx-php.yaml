services:
  app:
    image: demotools-pgz-demo-tools:latest
    command: ["/app/PGZDemoTools", "serve", "--host", "0.0.0.0", "--port", "8765", "--no-browser"]
    environment:
      PGZ_DEMO_PROGRESS_TIMEOUT_SECONDS: ${PGZ_DEMO_PROGRESS_TIMEOUT_SECONDS:-300}
    expose:
      - "8765"

  nginx:
    image: nginx:alpine
    ports:
      - "8771:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  php:
    image: php:8.5-fpm-alpine
