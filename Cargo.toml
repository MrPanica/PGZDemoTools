[package]
name = "pgz-demo-tools"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
default-run = "PGZDemoTools"

[[bin]]
name = "PGZDemoTools"
path = "src/main.rs"

[[bin]]
name = "PGZDemoToolsDesktop"
path = "src/desktop.rs"

[dependencies]
bitbuffer = "0.11"
clap = { version = "4.6", features = ["derive"] }
encoding_rs = "0.8"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
main_error = "0.1"
percent-encoding = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tf-demo-parser = { path = "helper/tf_parser" }
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
zip = { version = "4.6", default-features = false, features = ["deflate"] }
rfd = "0.15"
sys-locale = "0.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
